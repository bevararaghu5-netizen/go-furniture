services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gofurniture
      POSTGRES_USER: gofurniture
      POSTGRES_PASSWORD: gofurniture
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      PORT: 5000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: gofurniture
      DB_USER: gofurniture
      DB_PASSWORD: gofurniture
    depends_on:
      - database
    ports:
      - "5000:5000"

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    ports:
      - "8082:80"

volumes:
  postgres_data:
